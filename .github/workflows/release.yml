name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify makensis
        shell: pwsh
        run: |
          $m = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $m) {
            $fallback = "C:\Program Files (x86)\NSIS\makensis.exe"
            if (Test-Path $fallback) {
              echo $fallback | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              echo "Added $fallback to PATH"
            } else {
              Write-Error "makensis not found"
              exit 1
            }
          } else {
            makensis /VERSION
          }

      - name: Frontend build
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart("v")
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Ensure project.nsi UTF-8 BOM
        shell: pwsh
        run: |
          $path = "build/windows/installer/project.nsi"
          $bytes = [IO.File]::ReadAllBytes($path)
          $hasBom = ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)
          if (-not $hasBom) {
            $c = [IO.File]::ReadAllText($path, [Text.UTF8Encoding]::new($false))
            [IO.File]::WriteAllText($path, $c, [Text.UTF8Encoding]::new($true))
            Write-Output "Added UTF-8 BOM to $path"
          } else {
            Write-Output "$path already has UTF-8 BOM"
          }

      - name: Wails build (NSIS)
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $info = Get-Content build/windows/info.json -Raw | ConvertFrom-Json
          $info.productVersion = $ver
          $info | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 build/windows/info.json
          wails build -platform windows/amd64 -nsis -ldflags "-s -w -X main.version=${{ steps.ver.outputs.tag }}"

      - name: Package artifacts
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $bin = "build/bin"
          $out = "release-assets"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Write-Host "build/bin contents:"
          Get-ChildItem $bin | Format-Table Name, Length

          $setup = Get-ChildItem $bin -Filter "*installer*.exe" | Select-Object -First 1
          if (-not $setup) {
            Write-Error "NSIS installer missing in $bin (makensis likely not on PATH)"
            exit 1
          }
          $app = Get-ChildItem $bin -Filter "LOL*.exe" | Select-Object -First 1
          if (-not $app) {
            Write-Error "Application exe missing in $bin"
            exit 1
          }

          $setupName = "LOLAssistant-Setup-$ver.exe"
          $portName = "LOLAssistant-Portable-$ver.zip"
          Copy-Item $setup.FullName (Join-Path $out $setupName)

          $stage = Join-Path $out "_portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $app.FullName (Join-Path $stage "LOLAssistant.exe")
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath (Join-Path $out $portName) -Force
          Remove-Item $stage -Recurse -Force

          $sums = Get-ChildItem $out -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          }
          $sums | Set-Content -Encoding ascii (Join-Path $out "SHA256SUMS.txt")

          Get-ChildItem $out | Format-Table Name, Length

      - name: Extract changelog notes
        shell: pwsh
        run: |
          $ver = "v${{ steps.ver.outputs.version }}"
          $cl = Get-Content CHANGELOG.md -Raw
          $body = "See CHANGELOG.md"
          if ($cl -match "(?s)## \[$([regex]::Escape($ver))\][^\n]*\r?\n(.*?)(?=\r?\n## \[)") {
            $body = $Matches[1].Trim()
          } elseif ($cl -match "(?s)## \[$([regex]::Escape($ver))\][^\n]*\r?\n(.*)") {
            $body = $Matches[1].Trim()
          }
          # SHA256SUMS 写入正文：更新器可从官方 API 一次拿到哈希（直链 github.com 国内常超时）
          # 注意：pwsh 内勿用反引号字面量拼围栏（易被解析截断），用 char 拼接
          $sumsPath = "release-assets/SHA256SUMS.txt"
          if (Test-Path $sumsPath) {
            $sums = [IO.File]::ReadAllText($sumsPath).Trim()
            $nl = "`n"
            $fence = [string]::new([char]0x60, 3)
            $body = ($body.TrimEnd() + $nl + $nl + "### 安装校验" + $nl + $nl + $fence + "text" + $nl + $sums + $nl + $fence)
          }
          $body | Set-Content -Path release-notes.md -Encoding utf8
          Get-Content release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: release-notes.md
          files: |
            release-assets/*
